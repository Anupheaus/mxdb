name: Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PNPM_VERSION: '10'
  NODE_VERSION: '22'

jobs:
  # ── PREPARE ────────────────────────────────────────────────────────────────
  Prepare:
    name: Install Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-repos: 'Anupheaus/common Anupheaus/react-ui Anupheaus/nexus'
          install-args: '--no-frozen-lockfile'

  # ── VALIDATE (parallel) ────────────────────────────────────────────────────
  Validate-TypeCheck:
    name: Type check
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-repos: 'Anupheaus/common Anupheaus/react-ui Anupheaus/nexus'
          install-args: '--no-frozen-lockfile'
      - name: Type check
        run: pnpm exec tsc --noEmit --project tsconfig.ci.json

  Validate-Lint:
    name: Lint
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-repos: 'Anupheaus/common Anupheaus/react-ui Anupheaus/nexus'
          install-args: '--no-frozen-lockfile'
      - name: Lint
        run: pnpm run lint

  Validate-Audit:
    name: Security audit
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-repos: 'Anupheaus/common Anupheaus/react-ui Anupheaus/nexus'
          install-args: '--no-frozen-lockfile'
      - name: Security audit
        run: pnpm audit --audit-level=high --prod

  Validate-Secrets:
    name: Secret detection
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-repos: 'Anupheaus/common Anupheaus/react-ui Anupheaus/nexus'
          install-args: '--no-frozen-lockfile'
      - name: Secret detection (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          head: HEAD
          extra_args: --only-verified

  Validate-Trivy:
    name: Filesystem security scan
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-repos: 'Anupheaus/common Anupheaus/react-ui Anupheaus/nexus'
          install-args: '--no-frozen-lockfile'
      - name: Filesystem security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ── TEST (Unit) ─────────────────────────────────────────────────────────────
  Test:
    name: Unit Tests
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-repos: 'Anupheaus/common Anupheaus/react-ui Anupheaus/nexus'
          install-args: '--no-frozen-lockfile'

      - name: Run unit tests with coverage
        run: pnpm run test:ci -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # ── TEST (CRUD E2E) ─────────────────────────────────────────────────────────
  Test-CRUD:
    name: CRUD E2E Tests
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-repos: 'Anupheaus/common Anupheaus/react-ui Anupheaus/nexus'
          install-args: '--no-frozen-lockfile'

      - name: Generate TLS certificates for E2E server
        run: |
          mkdir -p tests/e2e/setup/certs
          openssl req -new -x509 -days 3650 -nodes -newkey rsa:2048 \
            -keyout tests/e2e/setup/certs/ca.key \
            -out tests/e2e/setup/certs/ca.crt \
            -subj "/CN=E2E Test CA"
          openssl req -new -nodes -newkey rsa:2048 \
            -keyout tests/e2e/setup/certs/localhost.key \
            -out tests/e2e/setup/certs/localhost.csr \
            -subj "/CN=localhost"
          printf '%s\n' \
            'authorityKeyIdentifier=keyid,issuer' \
            'basicConstraints=CA:FALSE' \
            'keyUsage = digitalSignature, keyEncipherment' \
            'extendedKeyUsage = serverAuth' \
            'subjectAltName = @alt_names' \
            '' \
            '[alt_names]' \
            'DNS.1 = localhost' \
            'IP.1 = 127.0.0.1' \
            > /tmp/localhost.ext
          openssl x509 -req -days 3650 -CAcreateserial \
            -in tests/e2e/setup/certs/localhost.csr \
            -CA tests/e2e/setup/certs/ca.crt \
            -CAkey tests/e2e/setup/certs/ca.key \
            -out tests/e2e/setup/certs/localhost.crt \
            -extfile /tmp/localhost.ext

      - name: Run CRUD E2E tests
        run: pnpm run test:crud

  # ── TEST (Performance E2E) — master only ────────────────────────────────────
  Test-Performance:
    name: Performance E2E Tests
    needs: Prepare
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-repos: 'Anupheaus/common Anupheaus/react-ui Anupheaus/nexus'
          install-args: '--no-frozen-lockfile'

      - name: Generate TLS certificates for E2E server
        run: |
          mkdir -p tests/e2e/setup/certs
          openssl req -new -x509 -days 3650 -nodes -newkey rsa:2048 \
            -keyout tests/e2e/setup/certs/ca.key \
            -out tests/e2e/setup/certs/ca.crt \
            -subj "/CN=E2E Test CA"
          openssl req -new -nodes -newkey rsa:2048 \
            -keyout tests/e2e/setup/certs/localhost.key \
            -out tests/e2e/setup/certs/localhost.csr \
            -subj "/CN=localhost"
          printf '%s\n' \
            'authorityKeyIdentifier=keyid,issuer' \
            'basicConstraints=CA:FALSE' \
            'keyUsage = digitalSignature, keyEncipherment' \
            'extendedKeyUsage = serverAuth' \
            'subjectAltName = @alt_names' \
            '' \
            '[alt_names]' \
            'DNS.1 = localhost' \
            'IP.1 = 127.0.0.1' \
            > /tmp/localhost.ext
          openssl x509 -req -days 3650 -CAcreateserial \
            -in tests/e2e/setup/certs/localhost.csr \
            -CA tests/e2e/setup/certs/ca.crt \
            -CAkey tests/e2e/setup/certs/ca.key \
            -out tests/e2e/setup/certs/localhost.crt \
            -extfile /tmp/localhost.ext

      - name: Run performance E2E tests
        run: pnpm run test:performance

  # ── TEST (Stress) — master only ─────────────────────────────────────────────
  Test-Stress:
    name: Stress Tests
    needs: Prepare
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-repos: 'Anupheaus/common Anupheaus/react-ui Anupheaus/nexus'
          install-args: '--no-frozen-lockfile'

      - name: Generate TLS certificates for E2E server
        run: |
          mkdir -p tests/e2e/setup/certs
          openssl req -new -x509 -days 3650 -nodes -newkey rsa:2048 \
            -keyout tests/e2e/setup/certs/ca.key \
            -out tests/e2e/setup/certs/ca.crt \
            -subj "/CN=E2E Test CA"
          openssl req -new -nodes -newkey rsa:2048 \
            -keyout tests/e2e/setup/certs/localhost.key \
            -out tests/e2e/setup/certs/localhost.csr \
            -subj "/CN=localhost"
          printf '%s\n' \
            'authorityKeyIdentifier=keyid,issuer' \
            'basicConstraints=CA:FALSE' \
            'keyUsage = digitalSignature, keyEncipherment' \
            'extendedKeyUsage = serverAuth' \
            'subjectAltName = @alt_names' \
            '' \
            '[alt_names]' \
            'DNS.1 = localhost' \
            'IP.1 = 127.0.0.1' \
            > /tmp/localhost.ext
          openssl x509 -req -days 3650 -CAcreateserial \
            -in tests/e2e/setup/certs/localhost.csr \
            -CA tests/e2e/setup/certs/ca.crt \
            -CAkey tests/e2e/setup/certs/ca.key \
            -out tests/e2e/setup/certs/localhost.crt \
            -extfile /tmp/localhost.ext

      - name: Run stress tests
        run: pnpm run test:stress

  # ── PUBLISH — master only, after all tests ───────────────────────────────────
  Publish:
    name: Build and Publish
    needs: [Validate-TypeCheck, Validate-Lint, Validate-Audit, Validate-Secrets, Validate-Trivy, Test, Test-CRUD, Test-Performance, Test-Stress]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # pnpm-setup strips the @anupheaus/* file: overrides (patch-package-json) in
      # the ephemeral working tree only and installs common/react-ui/nexus from the
      # registry — nothing is committed back, so master keeps its local-dev overrides.
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          patch-package-json: 'true'
          install-args: '--no-frozen-lockfile'

      - name: Build
        run: pnpm build

      - name: Publish (skip if version already exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry=https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published — skipping"
          else
            echo "Publishing $NAME@$VERSION"
            pnpm publish --no-git-checks
          fi
