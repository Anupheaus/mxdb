name: Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PNPM_VERSION: '10'
  NODE_VERSION: '22'

jobs:
  # ── PREPARE ────────────────────────────────────────────────────────────────
  Prepare:
    name: Install Dependencies
    concurrency:
      group: prepare-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'

  # ── VALIDATE (parallel) ────────────────────────────────────────────────────
  Validate-TypeCheck:
    name: Type check
    concurrency:
      group: validate-typecheck-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
      - name: Type check
        run: pnpm exec tsc --noEmit --project tsconfig.ci.json

  Validate-Lint:
    name: Lint
    concurrency:
      group: validate-lint-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
      - name: Lint
        run: pnpm run lint

  Validate-Audit:
    name: Security audit
    concurrency:
      group: validate-audit-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
      - name: Security audit
        run: pnpm audit --audit-level=high --prod

  Validate-Secrets:
    name: Secret detection
    concurrency:
      group: validate-secrets-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
      - name: Secret detection (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          head: HEAD
          extra_args: --only-verified

  Validate-Trivy:
    name: Filesystem security scan
    concurrency:
      group: validate-trivy-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
      - name: Filesystem security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ── TEST (Unit) ─────────────────────────────────────────────────────────────
  Test:
    name: Unit Tests
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'

      - name: Run unit tests with coverage
        run: pnpm run test:ci -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # ── TEST (CRUD E2E) ─────────────────────────────────────────────────────────
  Test-CRUD:
    name: CRUD E2E Tests
    concurrency:
      group: test-crud-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'

      - name: Generate TLS certificates for E2E server
        run: |
          mkdir -p tests/e2e/setup/certs
          openssl req -new -x509 -days 3650 -nodes -newkey rsa:2048 \
            -keyout tests/e2e/setup/certs/ca.key \
            -out tests/e2e/setup/certs/ca.crt \
            -subj "/CN=E2E Test CA"
          openssl req -new -nodes -newkey rsa:2048 \
            -keyout tests/e2e/setup/certs/localhost.key \
            -out tests/e2e/setup/certs/localhost.csr \
            -subj "/CN=localhost"
          printf '%s\n' \
            'authorityKeyIdentifier=keyid,issuer' \
            'basicConstraints=CA:FALSE' \
            'keyUsage = digitalSignature, keyEncipherment' \
            'extendedKeyUsage = serverAuth' \
            'subjectAltName = @alt_names' \
            '' \
            '[alt_names]' \
            'DNS.1 = localhost' \
            'IP.1 = 127.0.0.1' \
            > /tmp/localhost.ext
          openssl x509 -req -days 3650 -CAcreateserial \
            -in tests/e2e/setup/certs/localhost.csr \
            -CA tests/e2e/setup/certs/ca.crt \
            -CAkey tests/e2e/setup/certs/ca.key \
            -out tests/e2e/setup/certs/localhost.crt \
            -extfile /tmp/localhost.ext

      - name: DIAG react-ui resolution
        run: |
          echo "=== committed lockfile: @anupheaus/react-ui specifier+version ==="
          grep -n -A2 "'@anupheaus/react-ui':" pnpm-lock.yaml | head -6 || true
          echo "=== resolved packages of react-ui in lockfile ==="
          grep -oE "@anupheaus/react-ui@[0-9.]+" pnpm-lock.yaml | sort -u || true
          echo "=== react-ui versions materialised in node_modules/.pnpm ==="
          ls node_modules/.pnpm 2>/dev/null | grep -i react-ui || echo "(none in .pnpm)"
          echo "=== pnpm why @anupheaus/react-ui (what pulls each version) ==="
          pnpm why @anupheaus/react-ui || true
          echo "=== version actually resolved by mxdb's import path ==="
          node -e "const p=require.resolve('@anupheaus/react-ui/package.json'); console.log(p, require(p).version)" || true

      - name: Run CRUD E2E tests
        run: pnpm run test:crud

  # ── TEST (Performance E2E) — master only ────────────────────────────────────
  Test-Performance:
    name: Performance E2E Tests
    concurrency:
      group: test-performance-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'

      - name: Generate TLS certificates for E2E server
        run: |
          mkdir -p tests/e2e/setup/certs
          openssl req -new -x509 -days 3650 -nodes -newkey rsa:2048 \
            -keyout tests/e2e/setup/certs/ca.key \
            -out tests/e2e/setup/certs/ca.crt \
            -subj "/CN=E2E Test CA"
          openssl req -new -nodes -newkey rsa:2048 \
            -keyout tests/e2e/setup/certs/localhost.key \
            -out tests/e2e/setup/certs/localhost.csr \
            -subj "/CN=localhost"
          printf '%s\n' \
            'authorityKeyIdentifier=keyid,issuer' \
            'basicConstraints=CA:FALSE' \
            'keyUsage = digitalSignature, keyEncipherment' \
            'extendedKeyUsage = serverAuth' \
            'subjectAltName = @alt_names' \
            '' \
            '[alt_names]' \
            'DNS.1 = localhost' \
            'IP.1 = 127.0.0.1' \
            > /tmp/localhost.ext
          openssl x509 -req -days 3650 -CAcreateserial \
            -in tests/e2e/setup/certs/localhost.csr \
            -CA tests/e2e/setup/certs/ca.crt \
            -CAkey tests/e2e/setup/certs/ca.key \
            -out tests/e2e/setup/certs/localhost.crt \
            -extfile /tmp/localhost.ext

      - name: Run performance E2E tests
        run: pnpm run test:performance

  # ── TEST (Stress) — master only ─────────────────────────────────────────────
  Test-Stress:
    name: Stress Tests
    concurrency:
      group: test-stress-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'

      - name: Generate TLS certificates for E2E server
        run: |
          mkdir -p tests/e2e/setup/certs
          openssl req -new -x509 -days 3650 -nodes -newkey rsa:2048 \
            -keyout tests/e2e/setup/certs/ca.key \
            -out tests/e2e/setup/certs/ca.crt \
            -subj "/CN=E2E Test CA"
          openssl req -new -nodes -newkey rsa:2048 \
            -keyout tests/e2e/setup/certs/localhost.key \
            -out tests/e2e/setup/certs/localhost.csr \
            -subj "/CN=localhost"
          printf '%s\n' \
            'authorityKeyIdentifier=keyid,issuer' \
            'basicConstraints=CA:FALSE' \
            'keyUsage = digitalSignature, keyEncipherment' \
            'extendedKeyUsage = serverAuth' \
            'subjectAltName = @alt_names' \
            '' \
            '[alt_names]' \
            'DNS.1 = localhost' \
            'IP.1 = 127.0.0.1' \
            > /tmp/localhost.ext
          openssl x509 -req -days 3650 -CAcreateserial \
            -in tests/e2e/setup/certs/localhost.csr \
            -CA tests/e2e/setup/certs/ca.crt \
            -CAkey tests/e2e/setup/certs/ca.key \
            -out tests/e2e/setup/certs/localhost.crt \
            -extfile /tmp/localhost.ext

      - name: Run stress tests
        run: pnpm run test:stress

  # ── PUBLISH — master only, after all tests ───────────────────────────────────
  Publish:
    name: Build and Publish
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    needs: [Validate-TypeCheck, Validate-Lint, Validate-Audit, Validate-Secrets, Validate-Trivy, Test, Test-CRUD, Test-Performance, Test-Stress]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # @anupheaus/* resolve from the registry here — the local-dev symlinks in
      # .pnpmfile.cjs are inert in CI because the sibling repos are not checked out.
      # fetch-depth 0 is required so the version-bump step can push back to master.
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: '0'
          install-args: '--no-frozen-lockfile'

      - name: Build
        run: pnpm build

      - name: Bump version
        uses: phips28/gh-action-bump-version@master
        with:
          commit-message: 'CI: bumps version to {{version}} [skip ci]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: pnpm pack

      - name: Publish
        run: pnpm publish $(ls *.tgz) --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
